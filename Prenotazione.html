<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appuntamento con il Giardiniere</title>
  <link rel="icon" type="image/png" href="Img/Logo.png">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="prenotazione.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_green.css">
</head>

<body>
  <!-- Header -->
  <div id="header-container"></div>

  <!-- Breadcrumb -->
  <nav aria-label="breadcrumb" class="bg-white py-2">
    <ol class="breadcrumb container">
      <li class="breadcrumb-item"><a href="home.html">Home</a></li>
      <li class="breadcrumb-item active" aria-current="page">Prenotazione</li>
    </ol>
  </nav>

  <!-- Sezione Form Prenotazione -->
  <div class="form-section py-5">
    <div class="container date-box">
      <h1>Richiedi un Appuntamento</h1>
      <form id="form">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Inserisci il tuo nome" aria-label="Inserisci il tuo nome" required>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Inserisci la tua email" aria-label="Inserisci la tua email" required>
        <span id="errore-email" class="errore" aria-live="assertive"></span>
        <label for="telefono">Telefono / Cellulare</label>
        <input type="tel" id="telefono" name="telefono" placeholder="Es. +39 3401234567" aria-label="Inserisci il tuo numero di telefono" required></span>
        <label for="data">Data dell'appuntamento</label>
        <div class="calendar-wrapper">
          <input type="text" id="data" name="data" placeholder="Seleziona una data" required>
          <span class="calendar-icon" id="calendar-button">
            <img src="Img/icons8-calendario-48.png" alt="Calendario">
          </span>
        </div>
        <label for="messaggio">Messaggio</label>
        <textarea id="messaggio" name="messaggio" placeholder="Descrivi il servizio che desideri" aria-label="Descrivi il servizio che desideri" required></textarea>
        <div class="form-buttons">
          <button type="button" id="indietro-btn" class="btn-secondary" onclick="history.back()" aria-label="Torna alla pagina precedente">Indietro</button>
          <button type="button" id="continua-btn" aria-label="Continua. Cliccando si aprirà una modale di conferma." disabled>Continua</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/it.js"></script>
  <script src="prenotazione.js"></script>
  
  <!-- JS Bootstrap -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.0/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="Project.js"></script>
</body>

<!--Scroll to top-->
<button id="scrollToTop" class="scroll-to-top-btn" aria-label="Torna a inizio pagina">
  <img src="Img/icons8-su-30.png">
</button>

</html>
