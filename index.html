<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Giardiniere professionista a domicilio: servizi di cura, progettazione e manutenzione giardini a Napoli e provincia.">
    <title>Giardiniere Cosentino - Benvenuto</title>
    <link rel="icon" type="image/png" href="Img/Logo.png">
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Particles background -->
    <div class="particles-container">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Main Container -->
    <div class="landing-container">
        <!-- Logo Section -->
        <div class="logo-wrapper">
            <div class="logo-glow"></div>
            <img src="Img/Logo.png" alt="Giardiniere Cosentino Logo" class="main-logo">
        </div>

        <!-- Text Content -->
        <div class="content-wrapper">
            <h1 class="main-title">
                <span class="title-line">Il tuo giardino,</span>
                <span class="title-line">la mia passione</span>
            </h1>
            <p class="subtitle">Trasforma i tuoi spazi verdi in opere d'arte naturali</p>
        </div>

        <!-- CTA Button -->
        <a href="home.html" class="cta-button">
            <span class="button-text">Entra nel Sito</span>
            <span class="button-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg></span>
        </a>

        <!-- Decorative Elements -->
        <div class="leaf leaf-1">🌿</div>
        <div class="leaf leaf-2">🍃</div>
        <div class="leaf leaf-3">🌱</div>
        <div class="leaf leaf-4">🌿</div>

        <!-- Bottom Text -->
        <div class="bottom-text">
            <p>Servizi professionali di giardinaggio a Napoli e provincia</p>
        </div>
    </div>

    <script>
        // Animazione entrata
        window.addEventListener('load', () => {
            document.body.classList.add('loaded');
            setTimeout(() => {
                document.querySelector('.bottom-text').classList.add('visible');
            }, 1200);
        });

        // Effetto parallasse leggero al movimento del mouse
        document.addEventListener('mousemove', (e) => {
            const leaves = document.querySelectorAll('.leaf');
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;

            leaves.forEach((leaf, index) => {
                const speed = (index + 1) * 20;
                const x = (mouseX - 0.5) * speed;
                const y = (mouseY - 0.5) * speed;
                leaf.style.transform = `translate(${x}px, ${y}px) rotate(${x}deg)`;
            });

            // Logo parallasse
            const logo = document.querySelector('.main-logo');
            const logoX = (mouseX - 0.5) * 10;
            const logoY = (mouseY - 0.5) * 10;
            logo.style.transform = `translate(${logoX}px, ${logoY}px) scale(1)`;
        });

        // Animazione particelle
        const particles = document.querySelectorAll('.particle');
        particles.forEach((particle, index) => {
            const randomDelay = Math.random() * 5;
            const randomDuration = 15 + Math.random() * 10;
            particle.style.animationDelay = `${randomDelay}s`;
            particle.style.animationDuration = `${randomDuration}s`;
        });
    </script>
</body>

</html>
